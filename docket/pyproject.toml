[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docket"
version = "0.2.0"
description = "The reviewer that quotes its sources or shuts up."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  # The provenance substrate. docket IMPORTS throughline's dataset loader and
  # its /datasets router rather than reimplementing them, so the federation has
  # one provenance vocabulary and one set of refusal rules.
  #
  # throughline is not on PyPI. CI installs it from source before installing
  # docket, using the mechanism that already existed for the int+ stage
  # (scripts/fetch-substrate.sh, then pip install), after which this
  # requirement is already satisfied. Declared here anyway: a dependency that
  # is real at runtime but absent from the metadata is exactly the kind of
  # undeclared claim this component exists to refuse.
  "throughline>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "openapi-spec-validator>=0.7",
  "PyYAML>=6.0",
]

[project.scripts]
docket = "docket.cli:main"

[tool.setuptools.packages.find]
include = ["docket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["docket"]
omit = ["docket/__main__.py"]
