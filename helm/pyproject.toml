[project]
name = "helm"
version = "0.2.0"
description = "helm — the operator console (and signet, its identity binding) for the nemo-nvidia-demo federation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "openapi-spec-validator>=0.7",
  "playwright>=1.44",
]

[project.scripts]
helm = "helm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm*"]

[tool.setuptools.package-data]
helm = ["templates/*.html", "templates/**/*.html", "static/*", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: touches a real model endpoint; skipped when unreachable"]
addopts = "-m 'not live'"
