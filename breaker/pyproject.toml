[project]
name = "breaker"
version = "0.2.0"
description = "A breaker trips and only a human resets it."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "httpx>=0.27",
  # breaker mounts throughline's dataset discovery surface rather than
  # reimplementing it (breaker/app.py). throughline is not on PyPI: it is
  # installed from the wheel its own `package` job publishes, via
  # scripts/fetch-throughline.sh, BEFORE this file is resolved.
  "throughline>=0.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "openapi-spec-validator>=0.7",
]

[project.scripts]
breaker = "breaker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
