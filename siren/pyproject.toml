[project]
name = "siren"
version = "0.2.0"
description = "The class that hot-loads mid-demo from one config file."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  # The dataset registry loader and its read surface are throughline's, and
  # imported rather than copied — one registry idiom across the federation.
  # throughline is NOT on PyPI: install it from the sibling repository first
  # (scripts/fetch-throughline.sh does this in CI and locally), then install
  # siren. An already-satisfied requirement is not re-resolved against an
  # index, so this line records the dependency without inventing a download.
  "throughline>=0.2",
]

[project.scripts]
siren = "siren.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["siren*"]

[tool.setuptools.package-data]
siren = ["seed_snapshot.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
